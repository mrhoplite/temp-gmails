<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickMail - Free Temporary Email Service</title>
    <script src="https://cdn.tailwindcss.com"></script>

</head>
<body class="bg-slate-50 font-sans text-slate-900">

    <nav class="bg-white border-b border-slate-200 py-4 shadow-sm">
        <div class="max-w-5xl mx-auto px-6 flex justify-between items-center">
            <h1 class="text-2xl font-black text-indigo-600 tracking-tighter">QUICKMAIL</h1>
            <div class="flex gap-4">
                <a href="https://www.profitablecpmratenetwork.com/xk8k0e4c?key=2c8950d11898e4332f6c7349da6e02b1" target="_blank" class="text-xs font-bold bg-amber-100 text-amber-700 px-3 py-1 rounded-full hover:bg-amber-200 transition-all">★ High Speed Server</a>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-6 py-12">
        
        <div class="bg-white rounded-3xl shadow-xl border border-slate-100 overflow-hidden">
            <div class="p-8 border-b border-slate-50 text-center bg-indigo-600">
                <h2 class="text-white text-lg font-medium opacity-90 mb-4">Your Temporary Email Address</h2>
                <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
                    <input id="emailAddr" readonly class="w-full sm:w-2/3 bg-indigo-700/50 border border-indigo-400 text-white text-xl font-bold p-4 rounded-xl text-center outline-none" value="Generating...">
                    <button id="copyBtn" class="w-full sm:w-auto bg-white text-indigo-600 px-8 py-4 rounded-xl font-bold hover:bg-slate-100 transition-all active:scale-95 shadow-lg">Copy</button>
                </div>
                <p class="text-indigo-200 text-xs mt-4">Forget spam. Use this address to keep your real inbox clean.</p>
            </div>

            <div class="p-6">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-xl font-bold">Inbox</h3>
                    <div class="flex items-center gap-3">
                        <a href="https://www.profitablecpmratenetwork.com/xk8k0e4c?key=2c8950d11898e4332f6c7349da6e02b1" target="_blank" class="text-xs text-indigo-600 font-bold hover:underline">Manual Refresh</a>
                        <div class="flex items-center gap-2 text-xs text-slate-400">
                            <span id="refreshIcon" class="animate-spin h-2 w-2 bg-green-500 rounded-full"></span>
                            Live
                        </div>
                    </div>
                </div>

                <div id="inboxList" class="space-y-4">
                    <div class="text-center py-20 text-slate-400 italic">Waiting for incoming emails...</div>
                </div>
            </div>
        </div>

        <div class="mt-8 bg-white p-4 rounded-2xl shadow-md border border-slate-100">
            <p class="text-[10px] text-slate-300 mb-2 uppercase tracking-widest text-center">Sponsored Content</p>
            <script async="async" data-cfasync="false" src="https://pl29142039.profitablecpmratenetwork.com/8884b8cd5ca9416ba62fd810bf59a2fc/invoke.js"></script>
            <div id="container-8884b8cd5ca9416ba62fd810bf59a2fc"></div>
        </div>
    </main>

    <footer class="p-8 text-center text-slate-400 text-sm">
        <p>&copy; 2026 QuickMail - Private & Anonymous</p>
        <div class="mt-4 flex justify-center gap-6 grayscale opacity-60">
            <span class="text-[10px] font-bold">SECURE SSL</span>
            <span class="text-[10px] font-bold">NO LOGS</span>
            <span class="text-[10px] font-bold">FAST API</span>
        </div>
    </footer>

    <div id="emailModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-2xl rounded-2xl p-8 max-h-[80vh] overflow-y-auto shadow-2xl">
            <h2 id="modalSubject" class="text-2xl font-bold mb-4 text-indigo-600"></h2>
            <div id="modalContent" class="text-slate-600 leading-relaxed border-t pt-4"></div>
            <button onclick="closeModal()" class="mt-6 w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition-all">Close Email</button>
        </div>
    </div>

    <script src="https://pl29142037.profitablecpmratenetwork.com/63/63/f8/6363f82d93099eaf39e2f16e43c844af.js"></script>

    <script>
        const API_URL = "https://api.mail.tm";
        let currentAccount = null;

        async function init() {
            try {
                const domains = await fetch(`${API_URL}/domains`).then(res => res.json());
                const domain = domains["hydra:member"][0].domain;
                const user = Math.random().toString(36).substring(7);
                const password = "Password123!";
                const email = `${user}@${domain}`;

                const account = await fetch(`${API_URL}/accounts`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ address: email, password: password })
                }).then(res => res.json());

                const tokenData = await fetch(`${API_URL}/token`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ address: email, password: password })
                }).then(res => res.json());

                currentAccount = { ...account, token: tokenData.token };
                document.getElementById('emailAddr').value = email;
                
                checkInbox();
                setInterval(checkInbox, 5000);
            } catch (err) {
                document.getElementById('emailAddr').value = "Error generating email. Refresh.";
            }
        }

        async function checkInbox() {
            if (!currentAccount) return;
            try {
                const messages = await fetch(`${API_URL}/messages`, {
                    headers: { 'Authorization': `Bearer ${currentAccount.token}` }
                }).then(res => res.json());

                const list = document.getElementById('inboxList');
                const items = messages["hydra:member"];

                if (items.length > 0) {
                    list.innerHTML = '';
                    items.forEach(msg => {
                        const div = document.createElement('div');
                        div.className = "p-4 border border-slate-100 rounded-xl hover:bg-slate-50 cursor-pointer transition-all border-l-4 border-l-indigo-500 shadow-sm bg-white";
                        div.innerHTML = `
                            <div class="flex justify-between mb-1">
                                <span class="font-bold text-indigo-600 text-sm">${msg.from.address}</span>
                                <span class="text-[10px] text-slate-400">${new Date(msg.createdAt).toLocaleTimeString()}</span>
                            </div>
                            <div class="text-sm font-medium text-slate-700 truncate">${msg.subject}</div>
                        `;
                        div.onclick = () => readEmail(msg.id);
                        list.appendChild(div);
                    });
                }
            } catch (e) { console.log("Polling..."); }
        }

        async function readEmail(id) {
            const msg = await fetch(`${API_URL}/messages/${id}`, {
                headers: { 'Authorization': `Bearer ${currentAccount.token}` }
            }).then(res => res.json());

            document.getElementById('modalSubject').innerText = msg.subject;
            document.getElementById('modalContent').innerHTML = msg.html || msg.text;
            document.getElementById('emailModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('emailModal').classList.add('hidden');
        }

        document.getElementById('copyBtn').onclick = () => {
            const input = document.getElementById('emailAddr');
            input.select();
            document.execCommand('copy');
            // Popunder usually triggers here
            alert("Email Copied to Clipboard!");
        };

        init();
    </script>
</body>
</html>
